[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcj5291-reward_model_overfit_consistency_check"
version = "0.1.0"
description = "在同一个输入里两两比对，检测多模态算法研究员·奖励模型的过拟合相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "mcj5291" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://mcj5291.github.io"
Repository = "https://github.com/mcj5291/reward_model_overfit_consistency_check"
Issues = "https://github.com/mcj5291/reward_model_overfit_consistency_check/issues"

[project.scripts]
reward_model_overfit_consistency_check = "reward_model_overfit_consistency_check:main"

[tool.setuptools]
py-modules = ["reward_model_overfit_consistency_check"]
